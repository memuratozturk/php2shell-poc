# ModSecurity rule — blocks PHP_SESSION_UPLOAD_PROGRESS field
# Defense-in-depth layer, does NOT replace updating PHP.
# WAFs parse multipart differently from PHP; this is extra, not a fix.
SecRequestBodyAccess On
SecRule ARGS_NAMES "@streq PHP_SESSION_UPLOAD_PROGRESS" \
    "id:1026109618,phase:2,t:none,deny,status:403,log,\
    msg:'php2shell blocked (CVE-2026-109618/109619)'"
