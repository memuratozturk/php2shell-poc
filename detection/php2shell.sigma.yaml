# Sigma SIEM detection rules — CVE-2026-109618 / CVE-2026-109619
# Compatible: Splunk, Elastic, Microsoft Sentinel, QRadar, etc.

---
title: php2shell Upload Progress Exploitation
id: b7e4f210-9c83-4a12-be01-php2shell001
status: experimental
description: POST requests containing PHP_SESSION_UPLOAD_PROGRESS — primary trigger for both CVEs.
author: memuratozturk
date: 2026-10-22
references:
  - https://github.com/memuratozturk/php2shell-poc
  - https://nvd.nist.gov/vuln/detail/CVE-2026-109618
logsource:
  category: webserver
detection:
  selection:
    cs-method: POST
    cs-uri|endswith: '.php'
  keywords:
    - 'PHP_SESSION_UPLOAD_PROGRESS'
  condition: selection and keywords
level: high
falsepositives:
  - Legacy upload progress bars (rare in modern apps)
tags:
  - attack.initial_access
  - attack.t1190
  - cve.2026.109618
  - cve.2026.109619

---
title: php2shell OOM via Oversized Multipart POST
id: b7e4f210-9c83-4a12-be01-php2shell002
status: experimental
description: Large multipart POSTs (>5MB) to PHP endpoints returning 5xx. OOM corruption path.
author: memuratozturk
date: 2026-10-22
logsource:
  category: webserver
detection:
  selection:
    cs-method: POST
    cs-uri|endswith: '.php'
    sc-status:
      - 500
      - 502
      - 503
  filter_size:
    cs-bytes|gte: 5000000
  condition: selection and filter_size
level: medium
falsepositives:
  - Large file uploads that fail
tags:
  - attack.initial_access
  - attack.t1190
  - cve.2026.109618

---
title: php2shell Post-Exploitation Shell Spawn
id: b7e4f210-9c83-4a12-be01-php2shell003
status: experimental
description: Shell or interpreter spawned by PHP/Apache worker process — indicates successful RCE.
author: memuratozturk
date: 2026-10-22
logsource:
  product: linux
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
      - '/php-fpm'
      - '/php-cgi'
      - '/php'
      - '/apache2'
      - '/httpd'
  selection_child:
    Image|endswith:
      - '/sh'
      - '/bash'
      - '/dash'
      - '/python'
      - '/python3'
      - '/perl'
      - '/nc'
      - '/ncat'
      - '/curl'
      - '/wget'
  condition: selection_parent and selection_child
level: critical
falsepositives:
  - PHP apps that exec shell commands (image processing, cron)
tags:
  - attack.execution
  - attack.t1059
  - cve.2026.109618
  - cve.2026.109619

---
title: php2shell Session File Poisoning
id: b7e4f210-9c83-4a12-be01-php2shell004
status: experimental
description: PHP code in session files — session injection attack (Chain A).
author: memuratozturk
date: 2026-10-22
logsource:
  product: linux
  category: file_event
detection:
  selection_path:
    TargetFilename|contains:
      - '/sessions/sess_'
      - '/php/sessions/sess_'
  keywords_in_file:
    - '<?php'
    - 'system('
    - 'eval('
    - 'passthru('
  condition: selection_path and keywords_in_file
level: critical
falsepositives:
  - None — PHP code in session files is always malicious
tags:
  - attack.persistence
  - attack.t1505
  - cve.2026.109618

---
title: php2shell PHP OOM Fatal Error
id: b7e4f210-9c83-4a12-be01-php2shell005
status: experimental
description: Repeated PHP OOM errors on POST endpoints — exploitation attempt.
author: memuratozturk
date: 2026-10-22
logsource:
  product: php
  category: application
detection:
  keywords:
    - 'Allowed memory size'
    - 'exhausted'
  condition: keywords
level: medium
falsepositives:
  - Legitimate memory-heavy PHP scripts
tags:
  - attack.initial_access
  - cve.2026.109618
